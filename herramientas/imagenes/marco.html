<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Anton; src: url(fonts/anton.woff2) format("woff2"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0b0b0b; overflow: hidden; }
  #marco { position: relative; overflow: hidden; background: #0b0b0b; font-family: Anton, sans-serif; color: #fff; }
  .fondo { position: absolute; inset: -60px; background-size: cover; background-position: center;
           filter: blur(28px) brightness(.35) saturate(1.3); }
  .caja { position: absolute; left: 24px; right: 24px; top: 24px; display: flex; align-items: center; justify-content: center; }
  .caja img { max-width: 100%; max-height: 100%; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.8); }
  .pie { position: absolute; left: 0; right: 0; bottom: 0; height: 128px; background: #e3101b;
         display: flex; align-items: center; justify-content: center; gap: 18px;
         clip-path: polygon(0 18%, 18% 6%, 45% 14%, 72% 2%, 100% 12%, 100% 100%, 0 100%); padding-top: 14px; }
  .pie svg { width: 58px; height: 58px; flex: none; }
  .pie .tel { font-size: 54px; letter-spacing: 1px; display: flex; align-items: center; gap: 16px; }
  .pie .nums { display: flex; flex-direction: column; font-size: 40px; line-height: 1.02; color: #ffc400; }
  .pie .lugar { font-size: 25px; line-height: 1.05; border-left: 3px solid rgba(255,255,255,.6); padding-left: 18px; }
</style>
</head>
<body>
<div id="marco">
  <div class="fondo" id="fondo"></div>
  <div class="caja" id="caja"><img id="img" alt=""></div>
  <div class="pie">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-1.7-.1a15 15 0 0 1-1.5-.6 11.9 11.9 0 0 1-4.6-4c-.3-.5-.9-1.5-.9-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.1.1.3 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.6 2 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>
    <div class="tel">WHATSAPP <span class="nums"><span>385 456-6585</span><span>385 444-4487</span></span></div>
    <div class="lugar">MITRE 146 · FRÍAS<br>FRENTE PLAZA 9 DE JULIO</div>
  </div>
</div>
<script>
// Enmarca una imagen ya diseñada en un tamaño fijo, con fondo desenfocado y el pie con los WhatsApp.
window.cargar = (src, w, h) => new Promise((ok) => {
  const marco = document.getElementById("marco");
  marco.style.width = w + "px"; marco.style.height = h + "px";
  // En 9:16 (estados e historias) se dejan libres arriba y abajo las zonas que tapa la app.
  const vertical = h > w * 1.6, arriba = vertical ? 250 : 24, abajo = vertical ? 280 : 0;
  const caja = document.getElementById("caja");
  caja.style.top = arriba + "px";
  caja.style.height = (h - arriba - abajo - 140) + "px";
  document.querySelector(".pie").style.bottom = abajo + "px";
  document.getElementById("fondo").style.backgroundImage = `url("${src}")`;
  const img = document.getElementById("img");
  img.onload = img.onerror = ok;
  img.src = src;
});
</script>
</body>
</html>
